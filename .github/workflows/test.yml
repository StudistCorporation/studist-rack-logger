name: Tests

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  rubocop:
    runs-on: ubuntu-latest
    name: RuboCop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  yard:
    runs-on: ubuntu-latest
    name: YARD Documentation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - name: Check YARD documentation coverage
        run: bundle exec yard stats --list-undoc

  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby-version }} / Rack ${{ matrix.rack-version }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '3.3'
          - '3.4'
          - '4.0'
        rack-version:
          - '2.2'
          - '3.1'
          - '3.2'
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rack-${{ matrix.rack-version }}.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Show resolved Rack version
        run: bundle exec ruby -e 'require "rack"; puts Rack.release'
      - name: Run tests
        run: bundle exec rspec
      - name: Run gem build test
        run: gem build studist-rack-logger.gemspec
